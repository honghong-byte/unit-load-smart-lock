<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UNIT LOAD | 스마트 콜드체인</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#19283a;background:#edf3f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 14px;display:grid;place-items:center}.app{max-width:430px;width:100%;background:white;border:1px solid #d7e4ea;border-radius:23px;box-shadow:0 18px 45px #223d541c;overflow:hidden}.head{background:#112f47;color:white;padding:24px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#a9cedd;font-weight:700}.head h1{font-size:22px;line-height:1.4;margin:9px 0 6px}.head p{font-size:13px;color:#d4e4ee;margin:0}.content{padding:22px}.notice{padding:12px;border-radius:10px;background:#fff5de;color:#72551f;font-size:12px;line-height:1.6;margin-bottom:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:12px 0}.key{font-size:13px;color:#67798a}.val{font-size:14px;font-weight:700;text-align:right}.box{border:1px solid #e2eaee;padding:13px 16px;border-radius:13px;margin-bottom:18px}.state{display:flex;align-items:center;gap:12px;padding:18px;background:#edf4fa;border-radius:14px}.state.success{background:#e9f8f0}.circle{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#d5e8f5;font-size:24px}.success .circle{background:#c7ecd6}.state strong{display:block;margin-bottom:4px}.state small{color:#607589}button{width:100%;background:#12688e;border:0;border-radius:13px;color:white;font-size:16px;font-weight:700;min-height:54px;cursor:pointer;margin-top:18px}button:disabled{opacity:.65;cursor:default}button.secondary{background:#e9eef1;color:#42596a;margin-top:10px}.msg{text-align:center;color:#657988;font-size:13px;min-height:19px;margin-top:12px}.footer{font-size:11px;text-align:center;color:#78909e;border-top:1px solid #e5edf1;padding:14px}
</style></head>
<body><main class="app"><header class="head"><div class="eyebrow">UNIT LOAD · SMART PACKAGE</div><h1>스마트 콜드체인<br>포장재 잠금 관리</h1><p>전시용 시제품 · QR 출입 시연</p></header><div class="content"><div class="notice">이 페이지는 공모전 시연용입니다. 버튼을 눌러도 실제 상자의 잠금장치나 모터는 제어되지 않습니다.</div><section class="box"><div class="row"><span class="key">화물 ID</span><span class="val">UL-001</span></div><div class="row"><span class="key">제품 유형</span><span class="val">스마트 콜드체인 포장재</span></div><div class="row"><span class="key">설정 온도</span><span class="val">2~8°C (예시)</span></div><div class="row"><span class="key">측정 온도</span><span class="val">5.0°C (가상값)</span></div></section><div class="state" id="state" role="status" aria-live="polite"><div class="circle" id="symbol">🔒</div><div><strong id="label">잠금 상태: 잠김</strong><small id="detail">잠금 해제 버튼을 눌러 시연하세요.</small></div></div><button id="unlock">잠금 해제 (시연)</button><button id="reset" class="secondary" hidden>다시 잠그기 (초기화)</button><div class="msg" id="message" aria-live="polite"></div></div><footer class="footer">UNIT LOAD · 외형 및 기능 콘셉트 시연 · 실제 보안 기능 아님</footer></main>
<script>
const state=document.getElementById('state'),symbol=document.getElementById('symbol'),label=document.getElementById('label'),detail=document.getElementById('detail'),unlock=document.getElementById('unlock'),reset=document.getElementById('reset'),message=document.getElementById('message');
unlock.addEventListener('click',()=>{unlock.disabled=true;unlock.textContent='잠금 해제 중…';message.textContent='잠금 해제 명령을 시뮬레이션하고 있습니다.';setTimeout(()=>{state.classList.add('success');symbol.textContent='🔓';label.textContent='잠금 상태: 해제됨';detail.textContent='상자 뚜껑을 열 수 있는 상태(가상)입니다.';unlock.hidden=true;reset.hidden=false;message.textContent='✓ 시연 완료: 실제 하드웨어에는 신호를 보내지 않았습니다.';},700)});
reset.addEventListener('click',()=>{state.classList.remove('success');symbol.textContent='🔒';label.textContent='잠금 상태: 잠김';detail.textContent='잠금 해제 버튼을 눌러 시연하세요.';unlock.hidden=false;unlock.disabled=false;unlock.textContent='잠금 해제 (시연)';reset.hidden=true;message.textContent='초기화되었습니다.'});
</script></body></html>
